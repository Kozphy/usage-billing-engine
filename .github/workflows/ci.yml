name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: billing
          POSTGRES_PASSWORD: billing
          POSTGRES_DB: billing
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U billing -d billing"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Ruff
        run: ruff check app tests
      - name: Pytest (sqlite + postgres)
        run: pytest -q
        env:
          SECRET_KEY: ci-secret
          OUTBOX_SYNC: "true"
          PAYMENT_PROVIDER: mock
          OUTBOX_BACKOFF_SECONDS: "0"
          TEST_DATABASE_URL: postgresql+psycopg://billing:billing@127.0.0.1:5433/billing
