services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: billing
      POSTGRES_PASSWORD: billing
      POSTGRES_DB: billing
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U billing -d billing"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"

  api:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://billing:billing@db:5432/billing
      REDIS_URL: redis://redis:6379/0
      OUTBOX_SYNC: "false"
      PAYMENT_PROVIDER: mock
      SECRET_KEY: local-compose-secret-not-for-prod
      WORKER_ID: api
      LOG_LEVEL: INFO
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  worker:
    build:
      context: ./backend
    command: ["python", "-m", "app.worker"]
    environment:
      DATABASE_URL: postgresql+psycopg://billing:billing@db:5432/billing
      REDIS_URL: redis://redis:6379/0
      OUTBOX_SYNC: "false"
      PAYMENT_PROVIDER: mock
      SECRET_KEY: local-compose-secret-not-for-prod
      WORKER_ID: worker-1
      LOG_LEVEL: INFO
    depends_on:
      db:
        condition: service_healthy
